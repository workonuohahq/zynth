<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZYNTH — SpongeBob Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#7b2cbf;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh;overflow:hidden;display:grid;place-items:center}.stage{text-align:center;position:relative;width:100%;height:100vh;display:grid;place-items:center}.title{position:absolute;top:7vh;font-size:clamp(42px,9vw,110px);font-weight:900;letter-spacing:-.06em;color:#fff}.subtitle{position:absolute;bottom:7vh;font-size:12px;letter-spacing:.18em;color:#eadcff}.sponge{position:relative;width:min(240px,42vw);height:min(280px,50vw);background:#ffe43b;border:6px solid #111;border-radius:25% 22% 20% 25%;animation:bounce 1.1s ease-in-out infinite;box-shadow:12px 14px 0 rgba(0,0,0,.18)}.spot{position:absolute;background:#d6bd21;border-radius:50%}.s1{width:25px;height:20px;left:18%;top:22%}.s2{width:17px;height:28px;right:17%;top:34%}.s3{width:20px;height:15px;left:28%;bottom:18%}.eye{position:absolute;width:48px;height:58px;background:#fff;border:4px solid #111;border-radius:50%;top:22%;display:grid;place-items:center}.eye:after{content:"";width:18px;height:18px;background:#111;border-radius:50%}.e1{left:25%}.e2{right:25%}.mouth{position:absolute;width:105px;height:55px;border-bottom:7px solid #111;border-radius:0 0 60% 60%;left:50%;transform:translateX(-50%);bottom:23%}.arm{position:absolute;width:80px;height:6px;background:#111;top:52%}.a1{right:100%;transform:rotate(-20deg)}.a2{left:100%;transform:rotate(20deg)}.leg{position:absolute;width:6px;height:70px;background:#111;bottom:-70px}.l1{left:32%}.l2{right:32%}@keyframes bounce{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-28px) rotate(1deg)}}@media(max-width:500px){.sponge{border-width:4px}.eye{width:38px;height:46px}.eye:after{width:14px;height:14px}.mouth{width:80px;height:42px}}
</style>
</head>
<body><div class="stage"><div class="title">BILLIONAIRE</div><div class="sponge"><i class="spot s1"></i><i class="spot s2"></i><i class="spot s3"></i><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i><i class="arm a1"></i><i class="arm a2"></i><i class="leg l1"></i><i class="leg l2"></i></div><div class="subtitle">ZYNTH • ANIMATION TEST</div></div></body>
</html>
