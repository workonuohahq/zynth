name: ZYNTH Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ZYNTH health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -H "User-Agent: ZYNTH-Keepalive/1.0" \
            "https://zynth-lywd.onrender.com/api/health"
          echo "ZYNTH health check passed."
